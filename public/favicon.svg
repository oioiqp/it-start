<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.5" />
    </linearGradient>

    <!-- Symbol Primary Gradient (Electric Indigo to Cyan) -->
    <linearGradient id="primaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Accent Gradient (Cyan to Emerald) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="12" y="12" width="488" height="488" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow)" />

  <!-- Geometric Minimalist "IT-Start" Icon -->
  <g transform="translate(0, 0)">
    <!-- Letter "I" (Code Terminal Column) -->
    <rect x="136" y="160" width="46" height="192" rx="23" fill="#ffffff" />
    <circle cx="159" cy="116" r="23" fill="url(#accentGrad)" />

    <!-- Letter "T" + Start Launch Arrow -->
    <!-- Horizontal Crossbar of T -->
    <path d="M 216 160 H 376 C 388 160 398 170 398 182 C 398 194 388 204 376 204 H 216 C 204 204 194 194 194 182 C 194 170 204 160 216 160 Z" fill="#ffffff" />

    <!-- Dynamic Upward Start Vector (Rocket / Career Launch Arrow) -->
    <path d="M 276 204 L 276 329 C 276 341 286 352 299 352 C 311 352 321 341 321 329 L 321 248 L 362 289 C 370 297 383 297 392 289 C 400 280 400 267 392 259 L 324 191 C 315 182 302 182 294 191 L 276 204 Z" fill="url(#primaryGrad)" filter="url(#glow)" />

    <!-- Modern Launch Chevron / Rocket Thrust Spark -->
    <path d="M 230 248 L 336 142 L 358 164 L 252 270 Z" fill="url(#primaryGrad)" opacity="0.9" />

    <!-- Star / Sparkle of Opportunity (Top Right) -->
    <path d="M 390 100 Q 390 125 415 125 Q 390 125 390 150 Q 390 125 365 125 Q 390 125 390 100 Z" fill="url(#accentGrad)" filter="url(#glow)" />
  </g>
</svg>