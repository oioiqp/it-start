# ==============================================================================
# Koyeb App & Service Deployment Specification
# Service: IT-Start Telegram/VK Bot Runner & Health Check HTTP API
# Documentation: https://www.koyeb.com/docs/reference/koyeb-yaml
# ==============================================================================
definition:
  name: it-start
  services:
    - name: it-start-service
      type: web
      regions:
        - fra # Frankfurt (Europe) for low latency across CIS & Europe
      plan: nano # Free tier 512MB RAM nano instance (Always active / No sleep)
      instance_types:
        - type: nano
      git:
        repository: github.com/oioiqp/it-start
        branch: main
        builder: docker
        dockerfile: Dockerfile
      docker:
        dockerfile: Dockerfile
      ports:
        - port: 8000
          path: /
          protocol: http
      routes:
        - path: /
          port: 8000
      health_checks:
        - http:
            path: /health
            port: 8000
          grace_period: 10
          interval: 30
          timeout: 5
          restart_limit: 3
      env:
        - key: NODE_ENV
          value: production
        - key: PORT
          value: "8000"
        - key: TELEGRAM_BOT_TOKEN
          value: ""
        - key: VK_BOT_TOKEN
          value: ""
        - key: KOYEB_PUBLIC_URL
          value: "https://it-start-bot.koyeb.app"
