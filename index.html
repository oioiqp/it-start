<!doctype html>
<html lang="ru" class="light">
  <head>
    <meta charset="UTF-8" />
    <!-- VK Mini App Ultra-Fast Init Dispatch (iOS WKWebView, Android Bridge, Desktop Web) -->
    <script>
      (function() {
        try {
          // iOS WKWebView (нативный клиент VK на iPhone / iPad)
          if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.VKWebAppInit) {
            window.webkit.messageHandlers.VKWebAppInit.postMessage({});
          }
          // Android WebView (нативный клиент VK на Android)
          if (window.AndroidBridge && typeof window.AndroidBridge.VKWebAppInit === 'function') {
            window.AndroidBridge.VKWebAppInit(JSON.stringify({}));
          }
          // Desktop Web / Mobile Web Iframe (vk.com, vk.ru, m.vk.com)
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ handler: 'VKWebAppInit', params: {}, type: 'vk-connect' }, '*');
            window.parent.postMessage({ type: 'vk-connect', data: { handler: 'VKWebAppInit', params: {} } }, '*');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ccd3e0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="IT-Старт" />
    <meta name="description" content="IT-Старт: агрегатор стажировок и Junior-вакансий с интерактивными роадмапами, базой вопросов и уведомлениями в Telegram и ВКонтакте" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>IT-Старт | Стажировки, Роадмапы, Telegram & VK Боты</title>
    <!-- Inline Light Mode Initialization -->
    <script>
      (function() {
        try {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
          localStorage.setItem('it_start_theme', 'light');
        } catch (e) {}
      })();
    </script>
    <!-- Telegram Mini App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body class="antialiased selection:bg-neutral-900 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
