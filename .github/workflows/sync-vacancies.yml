name: Sync & Verify Live Vacancies

on:
  schedule:
    # Run every 4 hours automatically (24/7 free on GitHub)
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-vacancies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Parse Telegram channels & career APIs, verify links live, sync Supabase
        run: npm run sync
