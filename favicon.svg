<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Squircle Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Subtle Tech Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6" />
    </linearGradient>

    <!-- Soft Ambient Backlight -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Clean Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Subtle Shadow for Letters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="124" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Ambient Glow Behind Letters -->
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow)" />

  <!-- Pure Minimalist Typography "IT" -->
  <g fill="url(#textGrad)" filter="url(#shadow)">
    <!-- Letter "I" -->
    <rect x="119" y="144" width="58" height="224" rx="16" />

    <!-- Letter "T" -->
    <path d="
      M 233 144
      H 377
      C 386 144 393 151 393 160
      V 182
      C 393 191 386 198 377 198
      H 334
      V 352
      C 334 361 327 368 318 368
      H 292
      C 283 368 276 361 276 352
      V 198
      H 233
      C 224 198 217 191 217 182
      V 160
      C 217 151 224 144 233 144
      Z
    " />
  </g>
</svg>